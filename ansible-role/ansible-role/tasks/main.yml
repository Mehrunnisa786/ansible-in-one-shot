---
# tasks file for role/docker

- name: update system
  apt:
    name: "*"
    state: latest

- name: Install Docker.io
  apt:
    name: docker.io
    state: latest

- name: add user to docker group
  user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_user }}"

- name: restart docker
  service:
   name: docker
   state: restarted

- name: print docker version
  command: docker --version
  register: docker_version

- name: show docker version
  debug:
    msg: "{{ docker_version }}"

- name: show running containers
  command: docker ps